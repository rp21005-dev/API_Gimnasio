apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gimnasio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gimnasio
  template:
    metadata:
      labels:
        app: api-gimnasio
    spec:
      containers:
        - name: api-gimnasio
          image: api-gimnasio:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15

          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: gimnasio-config
                  key: DB_URL

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: gimnasio-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gimnasio-secret
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gimnasio-secret
                  key: JWT_SECRET