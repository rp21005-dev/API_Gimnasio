name: "CI: build, push and deploy"

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # GHCR requiere nombres en minúsculas; github.repository_owner ya lo es.
  IMAGE: ghcr.io/${{ github.repository_owner }}/api-gimnasio

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Despliegue educativo: levanta un clúster efímero con kind en el propio runner.
  # No requiere un clúster real ni el secreto KUBE_CONFIG.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear clúster efímero con kind
        uses: helm/kind-action@v1
        with:
          cluster_name: gimnasio

      - name: Construir la imagen
        run: docker build -t api-gimnasio:1.0 .

      - name: Cargar la imagen en kind
        run: kind load docker-image api-gimnasio:1.0 --name gimnasio

      - name: Crear el Secret desde GitHub Secrets
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          kubectl create secret generic gimnasio-secret \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Desplegar PostgreSQL
        run: |
          kubectl apply -f kubernetes/configmap.yaml
          kubectl apply -f kubernetes/postgres.yaml

      - name: Esperar a que PostgreSQL esté listo
        run: kubectl rollout status deployment/postgres --timeout=180s

      - name: Desplegar la API
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml

      - name: Esperar a que la API esté lista
        run: kubectl rollout status deployment/api-gimnasio --timeout=180s

      - name: Probar el inicio de sesión
        run: |
          kubectl port-forward svc/gimnasio-service 8080:8080 &
          sleep 5
          curl -s -X POST http://localhost:8080/gimnasioAPI/auth/login \
            -H "Content-Type: application/json" \
            -d '{"correo":"admin@gimnasio.com","contrasena":"clave1234"}'
          echo
