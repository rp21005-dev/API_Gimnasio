# Plantilla del Secret de la API. NO aplicar este archivo directamente:
# el Secret real se crea desde GitHub Secrets en el workflow de CI.
#
# Para crearlo a mano con valores propios:
#   kubectl create secret generic gimnasio-secret \
#     --from-literal=DB_USER=gimnasio \
#     --from-literal=DB_PASSWORD=<tu-contraseña> \
#     --from-literal=JWT_SECRET=<clave-de-al-menos-32-caracteres> \
#     --from-literal=POSTGRES_DB=gimnasio
apiVersion: v1
kind: Secret
metadata:
  name: gimnasio-secret
type: Opaque
stringData:
  DB_USER: "gimnasio"
  DB_PASSWORD: "cambiame"
  JWT_SECRET: "cambiame-por-una-clave-de-al-menos-32-caracteres"
  POSTGRES_DB: "gimnasio"
