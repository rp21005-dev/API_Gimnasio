# Configuración SOLO para las pruebas (reemplaza a src/main/resources/application.properties).
# Usa una base de datos H2 en memoria en modo PostgreSQL: las pruebas no necesitan
# PostgreSQL instalado ni el archivo .env, así pasan igual en cualquier equipo y en el pipeline.
spring.application.name=gimnasio-test

spring.datasource.url=jdbc:h2:mem:gimnasio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Clave de prueba para firmar los JWT (no se usa fuera de las pruebas)
jwt.secret=clave-solo-para-pruebas-automatizadas-0123456789abcdef

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Los datos de demostración se cargan para probar el inicio de sesión real
gimnasio.datos-demo=true

logging.level.root=WARN
logging.level.gimnasio=INFO
