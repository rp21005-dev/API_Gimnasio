spring.application.name=gimnasio

# Lee las variables locales desde el archivo .env (si existe)
spring.config.import=optional:file:.env[.properties]

# Conexion a PostgreSQL (las credenciales se leen de variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gimnasio}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
