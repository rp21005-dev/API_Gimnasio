spring.application.name=gimnasio

# Lee las variables locales desde el archivo .env (si existe)
# spring.config.import=optional:file:.env

# Conexion a PostgreSQL (las credenciales se leen de variables de entorno)
spring.datasource.url=jdbc:postgresql://localhost:5432/gimnasio_db
spring.datasource.username=postgres
spring.datasource.password=Aa13081

# Crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update

# Clave para firmar los tokens JWT (mínimo 32 caracteres, se lee del .env)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# No crear el usuario por defecto de Spring Security (usamos JWT con nuestros usuarios)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Niveles de log por paquete (TRACE < DEBUG < INFO < WARN < ERROR)
logging.level.root=INFO
logging.level.gimnasio=DEBUG
# Muestra las consultas SQL (sirve para comprobar el caché)
logging.level.org.hibernate.SQL=DEBUG

# Guarda los logs también en un archivo
logging.file.name=logs/gimnasio.log
